name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main
          push: false

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o dist/icc-agent ./cmd/icc-agent

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet build Icc.slnx -c Release
      - run: dotnet test --solution Icc.slnx -c Release --no-build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [agent, backend, ai, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl -fsS http://localhost:8088/api/version
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  testbed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: testbed/app/global.json
      - run: dotnet build testbed/app/Shop.slnx -c Release
      - name: Запуск магазина
        working-directory: testbed/app/deploy
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.distributed.yaml config --quiet
          docker compose up -d --build --wait --wait-timeout 300
      - name: Смоук-нагрузка k6 (30 с, ошибок < 1%)
        working-directory: testbed/load
        run: |
          docker run --rm --network host -v "$PWD/shop.js:/scripts/shop.js:ro" \
            -e SMOKE=1 -e BASE_URL=http://localhost:8000 -e BASE_RPS=10 \
            -e CYCLE_MINUTES=0.5 -e TOTAL_HOURS=0.0084 \
            grafana/k6:2.3.0 run --quiet /scripts/shop.js
      - if: failure()
        working-directory: testbed/app/deploy
        run: docker compose logs
