# Центр ICC: docker compose up -d --build
# Интерфейс — http://localhost:8088, gRPC для агентов — localhost:9090.
name: icc

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: icc
      POSTGRES_USER: icc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icc}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icc -d icc"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${METRICS_RETENTION:-180d}
      - -httpListenAddr=:8428
    volumes:
      - vm-data:/storage
    ports:
      - "127.0.0.1:${VM_PORT:-8428}:8428"
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=${LOGS_RETENTION:-180d}
      - -httpListenAddr=:9428
    volumes:
      - vl-data:/vlogs
    ports:
      - "127.0.0.1:${VL_PORT:-9428}:9428"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=icc;Username=icc;Password=${POSTGRES_PASSWORD:-icc}
      Storage__VictoriaMetricsUrl: http://victoriametrics:8428
      Storage__VictoriaLogsUrl: http://victorialogs:9428
      Ai__Url: http://ai:8000
    ports:
      # Агенты подключаются к центру по gRPC.
      - "${AGENT_GRPC_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
    restart: unless-stopped

  ai:
    build: ./ai
    environment:
      ICC_VICTORIAMETRICS_URL: http://victoriametrics:8428
      ICC_VICTORIALOGS_URL: http://victorialogs:9428
    restart: unless-stopped

  web:
    build: ./web
    environment:
      ICC_BACKEND: backend:8080
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  vm-data:
  vl-data:
