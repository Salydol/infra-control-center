# Демо-магазин стенда.
#
# Сервисы разнесены по профилям-узлам:
#   node1 — gateway, api, catalog, rabbitmq
#   node2 — payments-worker, notifications-worker, redis
#   node3 — postgres
# На одной машине: COMPOSE_PROFILES=node1,node2,node3 (см. .env.example).
# На трёх ВМ: у каждой свой профиль + compose.distributed.yaml с адресами узлов.
name: shop

x-app: &app
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "3" }

x-dotnet: &dotnet
  <<: *app
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 256M }

services:
  # ---------- node1 ----------
  gateway:
    <<: *app
    profiles: [node1]
    image: nginx:1.29-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
    depends_on:
      api: { condition: service_started, required: false }

  api:
    <<: *dotnet
    profiles: [node1]
    image: shop-api:${SHOP_VERSION:-1.0.0}
    build: { context: .., args: { SERVICE: Shop.Api } }
    env_file: ./env/api.env
    volumes:
      - ./config/api:/app/config:ro
    depends_on:
      catalog: { condition: service_started, required: false }
      rabbitmq: { condition: service_healthy, required: false }
      postgres: { condition: service_healthy, required: false }

  catalog:
    <<: *dotnet
    profiles: [node1]
    image: shop-catalog:${SHOP_VERSION:-1.0.0}
    build: { context: .., args: { SERVICE: Shop.Catalog } }
    env_file: ./env/catalog.env
    volumes:
      - ./config/catalog:/app/config:ro
    depends_on:
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy, required: false }

  rabbitmq:
    <<: *app
    profiles: [node1]
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    env_file: ./env/rabbitmq.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # Консоль управления — только локально на узле.
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # ---------- node2 ----------
  payments-worker:
    <<: *dotnet
    profiles: [node2]
    image: shop-payments-worker:${SHOP_VERSION:-1.0.0}
    build: { context: .., args: { SERVICE: Shop.PaymentsWorker } }
    env_file: ./env/payments-worker.env
    volumes:
      - ./config/payments-worker:/app/config:ro
    depends_on:
      rabbitmq: { condition: service_healthy, required: false }
      postgres: { condition: service_healthy, required: false }

  notifications-worker:
    <<: *dotnet
    profiles: [node2]
    image: shop-notifications-worker:${SHOP_VERSION:-1.0.0}
    build: { context: .., args: { SERVICE: Shop.NotificationsWorker } }
    env_file: ./env/notifications-worker.env
    volumes:
      - ./config/notifications-worker:/app/config:ro
    depends_on:
      rabbitmq: { condition: service_healthy, required: false }
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy, required: false }

  redis:
    <<: *app
    profiles: [node2]
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

  # ---------- node3 ----------
  postgres:
    <<: *app
    profiles: [node3]
    image: postgres:17-alpine
    env_file: ./env/postgres.env
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB",
              "-c", "log_min_duration_statement=500"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 768M }

volumes:
  rabbitmq-data:
  postgres-data:
