# Входная точка магазина: всё проксируется в api.
resolver 127.0.0.11 valid=10s ipv6=off;

log_format timed '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time us=$upstream_status';

server {
    listen 80;
    access_log /dev/stdout timed;
    error_log /dev/stderr warn;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $upstream http://api:8080;
        proxy_pass $upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }
}
