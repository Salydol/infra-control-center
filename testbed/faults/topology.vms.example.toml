[nodes.node2]
ssh = "icc@192.168.56.12"
deploy_dir = "/home/icc/infra-control-center/testbed/app/deploy"
compose_files = ["compose.yaml", "compose.distributed.yaml"]

[nodes.node3]
ssh = "icc@192.168.56.13"
deploy_dir = "/home/icc/infra-control-center/testbed/app/deploy"
