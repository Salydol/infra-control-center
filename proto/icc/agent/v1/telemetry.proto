syntax = "proto3";

package icc.agent.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Icc.Contracts.Agent.V1";

// Пакет метрик в модели Prometheus: имя + метки + значение.
// Центр пересылает их в VictoriaMetrics.
message MetricBatch {
  repeated MetricSample samples = 1;
}

message MetricSample {
  // Например "container_cpu_usage_ratio", "host_memory_used_bytes".
  string name = 1;
  map<string, string> labels = 2;
  double value = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// Пакет строк логов. Центр пересылает их в VictoriaLogs.
message LogBatch {
  repeated LogEntry entries = 1;
}

message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  LogSource source = 2;
  LogStream stream = 3;
  string message = 4;
  // Строка была обрезана до max_log_line_bytes.
  bool truncated = 5;
}

message LogSource {
  string container_id = 1;
  string container_name = 2;
  string compose_project = 3;
  string compose_service = 4;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}
