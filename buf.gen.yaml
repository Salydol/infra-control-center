# Генерация Go-кода для агента. C#-код генерирует сам backend при сборке
# (Grpc.Tools), поэтому здесь его нет.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: icc/agent/internal/pb
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: agent/internal/pb
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: agent/internal/pb
    opt: paths=source_relative
